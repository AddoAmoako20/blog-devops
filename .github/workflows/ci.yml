name: DevOpsHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project..."
          ls -la
          echo "Backend:"
          ls -la backend
          echo "Frontend:"
          ls -la frontend

      - name: Build backend Docker image
        run: |
          docker build -t devopshub-backend ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t devopshub-frontend ./frontend
